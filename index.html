<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header class="header">
        <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

            <div class="top">

                <li>Total <strong>150.5 $</strong></li>
            </div>

        </ul>
    </header>
    <div class="container">

            <h1 class="logo">13</h1>
            <h2 class="logo-2">Restaurant</h2>
            <div class="sroll">

                    <li onclick="filterMenu('All', this)" class="active">All</li>
                    <li onclick="filterMenu('Drinks', this)">Drinks</li>
                    <li onclick="filterMenu('Entrées', this)">Pizza</li>

                    <li onclick="filterMenu('Sandwiches', this)">Sandwiches</li>
                    <li onclick="filterMenu('Steaks', this)">Steaks</li>
                    <li onclick="filterMenu('Asian Cuisine', this)">Asian Cuisine</li>
                    <li onclick="filterMenu('Mexican', this)">Mexican</li>
                    <li onclick="filterMenu('Indian', this)">Indian</li>
                    <li onclick="filterMenu('Breakfast', this)">Breakfast</li>
                    <li onclick="filterMenu('Vegan', this)">Vegan</li>

                </ul>
            </div>
        </div>

        <div class="main-content" id="menu">
            
        </div>
    </div>
    <footer class="footer">
        <ul>
            <li></li>
            <li><a href="#" class="btn-1">Call Service</a><a href="#" class="btn-1">Order History</a> <a href="#"
                    class="btn-1">Cart : (<span>0</span>)</a></li>
        </ul>
        
    </footer>
    <script src="assets/js/script.js">
    </script>

</html>
